plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aditya'
version = '1.0.0'
description = 'Personal Budget - multi-tenant double-entry personal finance application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web layer (REST + static UI)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JPA annotations (mapping metadata + constraints) and Spring Data repository contracts.
    // Persistence itself is done by our own tab-separated file store - no database needed.
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.data:spring-data-commons'

    // @Transactional support on top of the file store
    implementation 'org.springframework:spring-tx'

    // Password hashing only (BCrypt), not the full Spring Security stack
    implementation 'org.springframework.security:spring-security-crypto'

    // Boilerplate reduction for entities (getters/setters)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Run from the project root so the ./data directory resolves to <project>/data
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}
