  <path d="M28.5 23.5 h7 M28.5 26.5 h7 M30 23.5 c4 0 4 6 0 6 l5 4.5" fill="none" stroke="#7a5400" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
