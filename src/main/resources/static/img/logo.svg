<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd3f5"/>
      <stop offset="0.55" stop-color="#0b8bd0"/>
      <stop offset="1" stop-color="#0a4f80"/>
