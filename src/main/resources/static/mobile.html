<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#143f62">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Personal Budget · Mobile</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <!-- absolute paths: this page is served at the address set in Settings (e.g. /m/) -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/evidence.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="mobile-app">
    <noscript>Personal Budget needs JavaScript.</noscript>

    <section class="m-login" id="m-login" hidden>
        <div class="m-login-card">
            <img src="/img/logo.svg" alt="" class="m-logo">
            <h1>Personal<em>Budget</em></h1>
            <p>Your money, on the go</p>
            <form id="m-login-form" autocomplete="on">
                <label><span>Username</span><input name="username" autocomplete="username" autocapitalize="none" required></label>
                <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
                <button type="submit" class="m-btn primary block">Sign in</button>
                <p class="m-error" id="m-login-error"></p>
            </form>
            <a class="m-full-link" href="/">Open the full site</a>
        </div>
    </section>

    <div class="m-app" id="m-app" hidden>
        <header class="m-top">
            <img src="/img/logo.svg" alt="" class="m-top-logo">
            <div class="m-top-title"><b id="m-title">Home</b><small id="m-tenant"></small></div>
            <button class="m-icon-btn" id="m-refresh" aria-label="Refresh"></button>
            <button class="m-avatar" id="m-user" aria-label="Account"></button>
        </header>
        <main class="m-view" id="m-view"></main>
        <button class="m-fab" id="m-fab" aria-label="Add expense" hidden></button>
        <nav class="m-tabs" id="m-tabs"></nav>
    </div>

    <div class="m-toast" id="m-toast" hidden></div>
    <div class="toast-host" id="toast-host"></div>
    <script type="module" src="/js/mobile/app.js"></script>
</body>
</html>
